[package]
name = "juliaupgui"
version = "0.1.0"
edition = "2021"
description = "Graphical interface for the Julia version manager"
license = "MIT"

[[bin]]
name = "juliaupgui"
path = "src/main.rs"

[dependencies]
juliaup = { path = ".." }
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
anyhow = "1"
human-panic = "2"
itertools = "0.15"
numeric-sort = "0.1"
rfd = "0.17"
