name: rustfmt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# https://github.com/reviewdog/action-suggester?tab=readme-ov-file#required-permissions
permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  rustfmt:
    name: Rustfmt Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
      - name: Rustfmt check
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo fmt -- --check -v
      - name: Rustfmt PR
        if: ${{ github.event_name == 'pull_request' }}
        run: cargo fmt -- --check -v
      - name: Suggest format changes
        if: ${{ github.event_name == 'pull_request' && failure() }}
        uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
        with:
          tool_name: rustfmt
          fail_level: error
